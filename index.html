<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brick — playground</title>
    <link rel="stylesheet" href="/src/styles/theme.css" />
    <style>
      /* The playground paints its own canvas from the roles, which is what a host
         has to do: the theme says what a component paints, not what the page
         does. Without this the page stays white under a dark preference. */
      body {
        background: var(--bk-bg-surface);
        color: var(--bk-text-default);
      }
    </style>
  </head>
  <body>
    <h1>Brick</h1>

    <section>
      <h2>Button</h2>
      <div>
        <bk-button>Save changes</bk-button>
        <bk-button variant="secondary">Cancel</bk-button>
        <bk-button variant="ghost">Learn more</bk-button>
        <bk-button disabled>Disabled</bk-button>
      </div>
    </section>

    <section>
      <h2>Input</h2>
      <div>
        <bk-input label="Email" helper="We never share it." placeholder="you@brick.dev"></bk-input>
        <bk-input label="Email" error="That address looks wrong." value="you@brick"></bk-input>
      </div>
    </section>

    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
