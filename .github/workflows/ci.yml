name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: the browser is restored while the lockfile has not moved
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: the browser the suite runs is the one the lockfile pins
        run: npx playwright install --with-deps chromium
      - name: formatting is Prettier's
        run: pnpm format:check
      - name: tokens are generated from tokens/*.json
        run: |
          pnpm build:tokens
          if [ -n "$(git status --porcelain -- src/styles)" ]; then
            git status --porcelain -- src/styles
            echo "::error::generated token CSS is out of date; run pnpm build:tokens and commit the result"
            exit 1
          fi
      - name: the component manifest is generated from the code, and twice the same
        run: |
          pnpm build:manifest
          cp src/custom-elements.json "$RUNNER_TEMP/manifest-once.json"
          pnpm build:manifest
          cmp "$RUNNER_TEMP/manifest-once.json" src/custom-elements.json
          node -e "const m=require('./src/custom-elements.json');const n=m.modules.flatMap(x=>x.declarations||[]).filter(d=>d.tagName).length;if(n<13){console.error('the manifest declares '+n+' elements, expected at least 13');process.exit(1)}"
      - run: pnpm check:tokens
      - run: pnpm typecheck
      - run: pnpm test

  storybook:
    name: storybook build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tokens
      - run: pnpm build-storybook
      - run: grep -rq 'customElements.define' storybook-static/assets || (echo 'the storybook build registers no element; a story renders bare text when its element never upgraded' && exit 1)
