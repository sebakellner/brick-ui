name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: formatting is Prettier's
        run: pnpm format:check
      - name: tokens are generated from tokens/*.json
        run: |
          pnpm build:tokens
          if [ -n "$(git status --porcelain -- packages/styles/src)" ]; then
            git status --porcelain -- packages/styles/src
            echo "::error::generated token CSS is out of date; run pnpm build:tokens and commit the result"
            exit 1
          fi
      - name: the browser image is the one the lockfile pins
        run: node scripts/check-playwright-image.mjs
      - name: the component manifest is generated from the code, and twice the same
        run: |
          pnpm build:manifest
          cp packages/web-components/src/custom-elements.json "$RUNNER_TEMP/manifest-once.json"
          pnpm build:manifest
          cmp "$RUNNER_TEMP/manifest-once.json" packages/web-components/src/custom-elements.json
          node scripts/check-manifest.mjs
      - name: the READMEs and the manifest agree, in both directions
        run: node scripts/check-readmes.mjs
      - run: pnpm check:tokens
      - name: the token check refuses the prefix this kit no longer publishes
        run: pnpm test:checks
      - name: the packages pack, and a consumer outside the workspace resolves them
        run: pnpm check:artifacts
      - name: the example installs the tarballs and builds
        run: |
          pnpm --filter @brikka-ui/styles build
          pnpm --filter @brikka-ui/web-components build
          mkdir -p examples/brikka-vite-ts/.pack
          (cd packages/styles && pnpm pack --pack-destination ../../examples/brikka-vite-ts/.pack)
          (cd packages/web-components && pnpm pack --pack-destination ../../examples/brikka-vite-ts/.pack)
          cd examples/brikka-vite-ts
          pnpm install --no-frozen-lockfile
          pnpm build
          grep -rq 'customElements.define' dist/assets || (echo 'the example built no element registration' && exit 1)
      - run: pnpm typecheck
      - run: pnpm test

  storybook:
    name: storybook build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tokens
      - run: pnpm build-storybook
      - run: grep -rq 'customElements.define' storybook-static/assets || (echo 'the storybook build registers no element; a story renders bare text when its element never upgraded' && exit 1)
