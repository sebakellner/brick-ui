name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: formatting is Prettier's
        run: pnpm format:check
      - name: tokens are generated from tokens/*.json
        run: |
          pnpm build:tokens
          if [ -n "$(git status --porcelain -- src/styles)" ]; then
            git status --porcelain -- src/styles
            echo "::error::generated token CSS is out of date; run pnpm build:tokens and commit the result"
            exit 1
          fi
      - name: the browser image is the one the lockfile pins
        run: node scripts/check-playwright-image.mjs
      - name: the component manifest is generated from the code, and twice the same
        run: |
          pnpm build:manifest
          cp src/custom-elements.json "$RUNNER_TEMP/manifest-once.json"
          pnpm build:manifest
          cmp "$RUNNER_TEMP/manifest-once.json" src/custom-elements.json
          node scripts/check-manifest.mjs
      - run: pnpm check:tokens
      - run: pnpm typecheck
      - run: pnpm test

  storybook:
    name: storybook build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tokens
      - run: pnpm build-storybook
      - run: grep -rq 'customElements.define' storybook-static/assets || (echo 'the storybook build registers no element; a story renders bare text when its element never upgraded' && exit 1)
