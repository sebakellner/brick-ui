<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Brikka × Vite × TypeScript</title>
  </head>
  <body>
    <main>
      <h1>Brikka</h1>

      <brikka-field>
        <brikka-input name="email" type="email">
          <brikka-field-label>Email</brikka-field-label>
          <brikka-field-description>We only use it for the receipt.</brikka-field-description>
        </brikka-input>
      </brikka-field>

      <brikka-field>
        <brikka-slider name="volume" value="40" ticks step="10">
          <brikka-field-label>Volume</brikka-field-label>
        </brikka-slider>
      </brikka-field>
      <p id="output">Volume: 40</p>

      <div class="row">
        <brikka-button>Save changes</brikka-button>
        <brikka-button variant="secondary">Cancel</brikka-button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
