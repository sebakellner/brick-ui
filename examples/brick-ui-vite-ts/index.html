<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Brick × Vite × TypeScript</title>
  </head>
  <body>
    <main>
      <h1>Brick</h1>

      <bk-field>
        <bk-input name="email" type="email">
          <bk-field-label>Email</bk-field-label>
          <bk-field-description>We only use it for the receipt.</bk-field-description>
        </bk-input>
      </bk-field>

      <bk-field>
        <bk-slider name="volume" value="40" ticks step="10">
          <bk-field-label>Volume</bk-field-label>
        </bk-slider>
      </bk-field>
      <p id="output">Volume: 40</p>

      <div class="row">
        <bk-button>Save changes</bk-button>
        <bk-button variant="secondary">Cancel</bk-button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
